name: nse-flow

# daily NSE flow fetch: participant-wise F&O positioning + bulk deals.
# runs after NSE publishes end-of-day participant data (~evening IST).
# fail-soft: a blocked or missing day is skipped, the next run backfills.

on:
  schedule:
    # NSE publishes participant OI after market close; ~20:30 IST = 15:00 UTC.
    # run at 16:30 UTC (22:00 IST) to be safely after publication, weekdays.
    - cron: "30 16 * * 1-5"
    # a Saturday catch-up that backfills the week in case weekday runs were
    # blocked on a bad runner IP
    - cron: "30 6 * * 6"
  workflow_dispatch:
    inputs:
      days:
        description: "how many days back to fetch/backfill"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install minimal deps
        run: pip install requests pandas supabase

      - name: resolve backfill window
        id: win
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "days=${{ inputs.days }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 6 * * 6" ]; then
            echo "days=7" >> "$GITHUB_OUTPUT"
          else
            echo "days=3" >> "$GITHUB_OUTPUT"
          fi

      - name: fetch and store NSE flow
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m engine.nse_flow --days "${{ steps.win.outputs.days }}"
